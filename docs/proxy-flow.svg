<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#222">InstaLingo: how a lookup gets its answer</text>

  <!-- Path A -->
  <text x="30" y="68" font-weight="600" fill="#1a7f37">A. No personal key (built-in key via proxy)</text>

  <rect x="30" y="85" width="150" height="70" rx="10" fill="#e8f1ff" stroke="#3b82f6"/>
  <text x="105" y="115" text-anchor="middle" font-weight="600">Your Mac</text>
  <text x="105" y="135" text-anchor="middle" font-size="12">InstaLingo app</text>

  <rect x="260" y="85" width="230" height="70" rx="10" fill="#fff4e0" stroke="#f59e0b"/>
  <text x="375" y="108" text-anchor="middle" font-weight="600">Cloudflare Worker</text>
  <text x="375" y="127" text-anchor="middle" font-size="12">checks rules + adds secret key</text>
  <text x="375" y="144" text-anchor="middle" font-size="12">🔑 key lives only here</text>

  <rect x="570" y="85" width="150" height="70" rx="10" fill="#efe7ff" stroke="#8b5cf6"/>
  <text x="645" y="115" text-anchor="middle" font-weight="600">Groq</text>
  <text x="645" y="135" text-anchor="middle" font-size="12">gpt-oss model</text>

  <line x1="180" y1="108" x2="258" y2="108" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="219" y="98" text-anchor="middle" font-size="11">① word +</text>
  <text x="219" y="126" text-anchor="middle" font-size="11">install ID</text>
  <line x1="490" y1="108" x2="568" y2="108" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="529" y="98" text-anchor="middle" font-size="11">② + key</text>
  <line x1="568" y1="138" x2="492" y2="138" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="529" y="152" text-anchor="middle" font-size="11">③ answer</text>
  <line x1="258" y1="138" x2="182" y2="138" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="219" y="152" text-anchor="middle" font-size="11">④ answer</text>

  <!-- Worker checks -->
  <rect x="260" y="180" width="230" height="200" rx="10" fill="#fffaf0" stroke="#f59e0b" stroke-dasharray="5 4"/>
  <text x="375" y="203" text-anchor="middle" font-weight="600">Worker checks, in order</text>
  <text x="275" y="228" font-size="13">1. Valid install ID?       <tspan fill="#c0392b">else 401</tspan></text>
  <text x="275" y="252" font-size="13">2. Body small + valid?     <tspan fill="#c0392b">else 400/413</tspan></text>
  <text x="275" y="276" font-size="13">3. Model on allowlist?     <tspan fill="#c0392b">else 400</tspan></text>
  <text x="275" y="300" font-size="13">4. Cap tokens at 700</text>
  <text x="275" y="324" font-size="13">5. Under daily limits?     <tspan fill="#c0392b">else 429</tspan></text>
  <text x="275" y="348" font-size="12" fill="#666">(per install, per IP, global)</text>
  <text x="275" y="370" font-size="13">6. Add secret key, forward</text>
  <line x1="375" y1="155" x2="375" y2="178" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Errors -->
  <rect x="30" y="200" width="200" height="110" rx="10" fill="#fdecea" stroke="#e57373"/>
  <text x="130" y="224" text-anchor="middle" font-weight="600">If 429 comes back</text>
  <text x="130" y="246" text-anchor="middle" font-size="12">App shows: "built-in key is</text>
  <text x="130" y="263" text-anchor="middle" font-size="12">limited, add your own key"</text>
  <text x="130" y="288" text-anchor="middle" font-size="12">Other errors: network / retry</text>

  <!-- Result -->
  <rect x="520" y="200" width="200" height="110" rx="10" fill="#e9f7ef" stroke="#34a853"/>
  <text x="620" y="224" text-anchor="middle" font-weight="600">Success</text>
  <text x="620" y="246" text-anchor="middle" font-size="12">App reads meaning / example /</text>
  <text x="620" y="263" text-anchor="middle" font-size="12">detail, caches it, shows it in</text>
  <text x="620" y="280" text-anchor="middle" font-size="12">the lookup panel</text>

  <!-- Path B -->
  <line x1="30" y1="415" x2="870" y2="415" stroke="#ddd"/>
  <text x="30" y="445" font-weight="600" fill="#1a7f37">B. You added your own key (direct, no proxy)</text>

  <rect x="30" y="465" width="150" height="70" rx="10" fill="#e8f1ff" stroke="#3b82f6"/>
  <text x="105" y="495" text-anchor="middle" font-weight="600">Your Mac</text>
  <text x="105" y="515" text-anchor="middle" font-size="12">🔑 key in Keychain</text>

  <rect x="570" y="465" width="150" height="70" rx="10" fill="#efe7ff" stroke="#8b5cf6"/>
  <text x="645" y="495" text-anchor="middle" font-weight="600">Groq</text>
  <text x="645" y="515" text-anchor="middle" font-size="12">unlimited on your plan</text>

  <line x1="180" y1="488" x2="568" y2="488" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="375" y="480" text-anchor="middle" font-size="11">word + your key</text>
  <line x1="568" y1="518" x2="182" y2="518" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="375" y="534" text-anchor="middle" font-size="11">answer</text>

  <!-- Legend -->
  <text x="30" y="590" font-size="13" fill="#444">Shared key: never in the app, repo or traffic from your Mac. It exists only inside the Worker.</text>
  <text x="30" y="612" font-size="13" fill="#444">Your own key: stays in Keychain and goes only to Groq.</text>
</svg>
